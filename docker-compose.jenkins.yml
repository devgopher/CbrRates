# Local Jenkins (Linux) on Win11 Docker Desktop — Docker-out-of-Docker
#
#   cd <this repo root>
#   docker compose -f docker-compose.jenkins.yml up -d --build
#   UI: http://localhost:${JENKINS_HTTP_PORT:-8081}
#   (default 8081 so app stack can keep host port 8080)
#
# Preserve an existing jenkins_home volume (see docker volume ls):
#   $env:JENKINS_HOME_VOLUME = "<volume-name>"
#   docker compose -f docker-compose.jenkins.yml up -d --build
#
# Socket mount is enough on Docker Desktop Linux engine (no TCP 2375 needed).

services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile.jenkins
    image: cbrrates-jenkins:local
    container_name: cbrrates-jenkins
    ports:
      - "${JENKINS_HTTP_PORT:-8081}:8080"
      - "${JENKINS_AGENT_PORT:-50000}:50000"
    environment:
      DOCKER_HOST: unix:///var/run/docker.sock
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    # Local Dev: root can use the Desktop-mounted sock without GID issues
    user: root
    restart: unless-stopped

volumes:
  jenkins_home:
    # Reuse existing volume when JENKINS_HOME_VOLUME is set; else named volume
    name: ${JENKINS_HOME_VOLUME:-cbrrates_jenkins_home}
