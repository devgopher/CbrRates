services:
  web:
    build:
      context: .
      dockerfile: CbrRatesService.Web/Dockerfile
    ports:
      - "8085:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      CacheSettings__Redis__Enabled: "true"
      CacheSettings__Memory__Enabled: "false"
      CacheSettings__Redis__DefaultExpiration: "00:05:00"
      CacheSettings__Redis__EngineSettings__ConnectionString: redis:6379
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null -w '%{http_code}' http://localhost:8080/api/v1/rates | grep -E '200|204' >/dev/null"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

volumes:
  redis-data:
